# ─────────────────────────────────────────────────────────────────────────────
# auto-update-changelog.yml
# Auto-insert a changelog entry in changelog.html whenever a commit is pushed
# to docs/manufacturing-os-site/ on main (excluding bot commits to avoid loops).
#
# Inserts the entry right after the marker:
#   <!-- COMMIT_LOG_INSERT_HERE -->
# ─────────────────────────────────────────────────────────────────────────────
name: Auto-Update Changelog

on:
  push:
    branches: [main]
    paths:
      - 'docs/manufacturing-os-site/**'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: docs-changelog-pr-${{ github.sha }}
  cancel-in-progress: false

jobs:
  update-changelog:
    name: Insert Changelog Entry
    runs-on: ubuntu-latest

    # Skip commits made by this bot to prevent infinite loops
    if: |
      github.actor != 'github-actions[bot]' &&
      !contains(github.event.head_commit.message, '[skip changelog]') &&
      !contains(github.event.head_commit.message, 'chore(docs): auto-update changelog')

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # event commit may be behind the latest main checkout
          ref: main

      # ── 2. Set up Python ────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── 3. Detect changed files ─────────────────────────────────────
      - name: Detect changed site files
        id: diff
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          FILES=$(git diff --name-only "${SOURCE_SHA}^" "$SOURCE_SHA" -- docs/manufacturing-os-site/ \
                  | awk '$0 != "docs/manufacturing-os-site/changelog.html" && ++n <= 20' | tr '\n' ' ')
          echo "changed_files=$FILES" >> "$GITHUB_OUTPUT"
          echo "Changed: $FILES"

      # ── 4. Insert changelog entry ───────────────────────────────────
      - name: Insert changelog entry
        id: insert
        if: steps.diff.outputs.changed_files != ''
        env:
          COMMIT_SHA:  ${{ github.sha }}
          COMMIT_MSG:  ${{ github.event.head_commit.message }}
          COMMIT_AUTH: ${{ github.event.head_commit.author.name }}
          COMMIT_TS:   ${{ github.event.head_commit.timestamp }}
          CHANGED:     ${{ steps.diff.outputs.changed_files }}
          RUN_URL:     ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        run: |
          python - << 'PYEOF'
          import os, re, html, textwrap
          from datetime import datetime, timezone

          # ── Collect env vars ──────────────────────────────────────────────
          full_sha = os.environ['COMMIT_SHA']
          sha      = full_sha[:8]
          raw_msg  = os.environ.get('COMMIT_MSG',  'update docs').strip()
          author   = html.escape(os.environ.get('COMMIT_AUTH', 'unknown'))
          ts_raw   = os.environ.get('COMMIT_TS', '')
          changed  = os.environ.get('CHANGED', '').strip()
          run_url  = os.environ.get('RUN_URL', '#')

          # Parse timestamp
          try:
              dt = datetime.fromisoformat(ts_raw.replace('Z', '+00:00')).astimezone(timezone.utc)
              date_str = dt.strftime('%Y-%m-%d')
              time_str = dt.strftime('%H:%M UTC')
          except Exception:
              date_str = datetime.now(timezone.utc).strftime('%Y-%m-%d')
              time_str = datetime.now(timezone.utc).strftime('%H:%M UTC')

          # Escape message (first line only)
          msg_first  = html.escape(raw_msg.split('\n')[0][:120])
          msg_full   = html.escape(raw_msg[:400])

          # Changed files as pills
          file_pills = ''
          if changed:
              for f in changed.split():
                  basename = f.split('/')[-1]
                  if basename:
                      file_pills += f'<span style="display:inline-block;background:#1e2433;border:1px solid #2a2d3e;border-radius:4px;padding:1px 7px;font-size:11px;margin:2px 2px 0 0;color:#94a3b8;font-family:monospace;">{html.escape(basename)}</span>'

          # ── Build HTML entry ──────────────────────────────────────────────
          ENTRY = f'''
              <!-- source-commit: {full_sha} -->
              <!-- auto-generated: {date_str} {sha} -->
              <div class="entry">
                <div class="entry-version"><span class="version-tag" style="background:#1e3a5f;color:#93c5fd;border-color:#1e40af;font-family:monospace;font-size:10px;">{sha}</span></div>
                <div class="entry-dot done"></div>
                <div class="entry-body">
                  <div class="entry-card">
                    <div class="entry-header">
                      <span class="entry-title">📝 {msg_first}</span>
                      <span class="status-badge" style="background:#052e16;color:#22c55e;border:1px solid #166534;">✓ pushed</span>
                    </div>
                    <p class="entry-desc" style="margin-bottom:8px;">
                      Committed by <strong style="color:var(--text);">{author}</strong> · {date_str} {time_str}
                      · <a href="{run_url}" target="_blank" style="color:#3b82f6;text-decoration:none;">view commit ↗</a>
                    </p>
                    {f'<p style="margin-bottom:6px;">{file_pills}</p>' if file_pills else ''}
                    {f'<details style="margin-top:4px;"><summary style="font-size:11px;color:var(--muted);cursor:pointer;">Full commit message</summary><pre style="font-size:11px;color:var(--muted);white-space:pre-wrap;margin-top:6px;">{msg_full}</pre></details>' if chr(10) in raw_msg else ''}
                  </div>
                </div>
              </div>
          '''

          # ── Insert into changelog.html ────────────────────────────────────
          CHANGELOG = 'docs/manufacturing-os-site/changelog.html'
          MARKER    = '<!-- COMMIT_LOG_INSERT_HERE -->'

          with open(CHANGELOG, 'r', encoding='utf-8') as f:
              src = f.read()

          with open(os.environ['GITHUB_OUTPUT'], 'a') as gh:
              gh.write(f"entry_sha={sha}\n")
              gh.write(f"entry_date={date_str}\n")

          if f'<!-- source-commit: {full_sha} -->' in src:
              print(f"Entry for {full_sha} already present; no change")
              raise SystemExit(0)

          if MARKER not in src:
              # Marker not present — insert marker + entry after <div class="timeline">
              src = src.replace(
                  '<div class="timeline">',
                  f'<div class="timeline">\n\n    {MARKER}\n',
                  1
              )

          new_src = src.replace(MARKER, MARKER + ENTRY, 1)

          with open(CHANGELOG, 'w', encoding='utf-8') as f:
              f.write(new_src)

          print(f"Inserted entry for commit {sha} into changelog.html")

          PYEOF

      # ── 5. One idempotent review PR per source commit ─────────────────
      - name: Create or update changelog PR
        id: pr
        if: steps.diff.outputs.changed_files != ''
        uses: peter-evans/create-pull-request@271a8d0340265f705b14b6d32b9829c1cb33d45e # v7.0.8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: codex/changelog-${{ github.sha }}
          sign-commits: true
          draft: always-true
          add-paths: |
            docs/manufacturing-os-site/changelog.html
          commit-message: 'chore(docs): auto-update changelog for ${{ steps.insert.outputs.entry_sha }} [skip changelog]'
          title: 'chore(docs): auto-update changelog for ${{ steps.insert.outputs.entry_sha }} [skip changelog]'
          body: |
            ## English
            Adds a changelog entry for source commit ${{ github.sha }}; only changelog.html is included.
            Re-running this source run updates this same PR; different source commits keep separate PRs.
            GITHUB_TOKEN does not trigger follow-up CI: a maintainer must close and reopen
            this PR after the last bot update, then verify all required checks on its current head.
            Mark ready only after review. Retain [skip changelog] in the merge/squash message.

            ## ภาษาไทย
            เพิ่ม changelog ของ source commit นี้ รวมเฉพาะ changelog.html
            รัน source เดิมซ้ำจะอัปเดต PR เดิม คนละ commit ใช้คนละ PR เพื่อรักษาทุก entry
            ผู้ดูแลต้องปิดแล้วเปิด PR อีกครั้งหลัง bot อัปเดตล่าสุด เพื่อเริ่ม CI
            ตรวจ required checks ก่อน merge และคง [skip changelog] ในข้อความ merge/squash

            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      # ── 6. Job summary ───────────────────────────────────────────────
      - name: Write job summary
        if: always()
        env:
          COMMIT_AUTH: ${{ github.event.head_commit.author.name }}
          CHANGED_FILES: ${{ steps.diff.outputs.changed_files }}
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
          PR_OPERATION: ${{ steps.pr.outputs.pull-request-operation }}
        run: |
          echo "## Auto-Update Changelog — Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit SHA | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Author | ${COMMIT_AUTH} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Entry date | ${{ steps.insert.outputs.entry_date }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Changed files | ${CHANGED_FILES} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Run | ${{ github.run_id }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Review PR | ${PR_URL:-none (no diff or publication failed)} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| PR operation | ${PR_OPERATION:-none} |" >> "$GITHUB_STEP_SUMMARY"
          echo "Review and merge required; this run does not update main." >> "$GITHUB_STEP_SUMMARY"
