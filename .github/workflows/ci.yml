name: FPR Field-Purchase CI

on:
  pull_request:
    branches: ["main", "develop"]
    paths:
      - "*.sql"
      - "*.ts"
      - "supabase/**"
      - "scripts/**"
      - ".github/workflows/**"
  push:
    branches: ["main"]
    paths:
      - "*.sql"
      - "supabase/migrations/**"
      - "scripts/apply_migrations.sh"
      - ".github/workflows/ci.yml"
  workflow_dispatch:
    # Manual runs always perform the hosted security verification. Production
    # deployment remains opt-in and must still pass the read-only reconciliation.
    inputs:
      run_production_deploy:
        description: Reconcile production and deploy Edge Functions
        required: true
        default: false
        type: boolean

concurrency:
  # A manual read-only hosted verification must not cancel a production push
  # that is still applying migrations or deploying Edge Functions.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

# ─────────────────────────────────────────────────────────────────────────────
# Jobs
# ─────────────────────────────────────────────────────────────────────────────
permissions:
  contents: read

jobs:

  # ───────────────────────────────────────────────────────────────────────────
  # Job 1: Deno unit + integration tests (runs on every PR)
  # ───────────────────────────────────────────────────────────────────────────
  test:
    name: Deno Tests (21 suites)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      SUPABASE_URL:              ${{ secrets.MONOLITH_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.MONOLITH_SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_JWT_SECRET:       ${{ secrets.MONOLITH_SUPABASE_JWT_SECRET }}
      SUPABASE_ANON_KEY:         ${{ secrets.MONOLITH_SUPABASE_ANON_KEY }}
      LINE_FPR_CHANNEL_SECRET:   ${{ secrets.LINE_FPR_CHANNEL_SECRET }}
      LINE_FPR_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_FPR_CHANNEL_ACCESS_TOKEN }}
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_MONOLITH_CHANNEL_ACCESS_TOKEN }}
      LINE_API_BASE:             ${{ secrets.LINE_API_BASE }}
      DISPATCH_LIMIT:            "50"
      VERTICAL:                  "field_purchase"
      RATE_LIMIT_PER_MIN:        "30"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate production migration manifest
        run: bash scripts/apply_migrations.sh --check

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      # ── Unit tests (no network required — always run) ──────────────────────
      - name: Unit tests — line_webhook_handler
        run: |
          deno test --allow-env --no-check line_webhook_handler_test.ts

      - name: Unit tests — line_oa_dispatch_worker
        run: |
          deno test --allow-env --no-check line_oa_dispatch_worker_test.ts

      # ── Integration tests (require Supabase secrets) ───────────────────────
      - name: Integration tests — approval queue
        if: env.SUPABASE_URL != ''
        run: |
          deno test --allow-env --allow-net --no-check \
            rpc_get_fpr_approval_queue_integration_test.ts

      - name: Integration tests — close request
        if: env.SUPABASE_URL != ''
        run: |
          deno test --allow-env --allow-net --no-check \
            rpc_close_field_purchase_request_integration_test.ts

      - name: Integration tests — escalate request
        if: env.SUPABASE_URL != ''
        run: |
          deno test --allow-env --allow-net --no-check \
            rpc_escalate_field_purchase_request_integration_test.ts

      - name: Integration tests — reopen request
        if: env.SUPABASE_URL != ''
        run: |
          deno test --allow-env --allow-net --no-check \
            rpc_reopen_field_purchase_request_integration_test.ts

      - name: Integration tests — bulk close
        if: env.SUPABASE_URL != ''
        run: |
          deno test --allow-env --allow-net --no-check \
            rpc_bulk_close_field_purchase_request_integration_test.ts

      - name: Integration tests — bulk reopen
        if: env.SUPABASE_URL != ''
        run: |
          deno test --allow-env --allow-net --no-check \
            rpc_bulk_reopen_field_purchase_request_integration_test.ts

      - name: Integration tests — bulk escalate
        if: env.SUPABASE_URL != ''
        run: |
          deno test --allow-env --allow-net --no-check \
            rpc_bulk_escalate_field_purchase_request_integration_test.ts

      - name: Integration tests — bulk reject
        if: env.SUPABASE_URL != ''
        run: |
          deno test --allow-env --allow-net --no-check \
            rpc_bulk_reject_field_purchase_request_integration_test.ts

      - name: Integration tests — bulk approve
        if: env.SUPABASE_URL != ''
        run: |
          deno test --allow-env --allow-net --no-check \
            rpc_bulk_approve_field_purchase_request_integration_test.ts

      - name: Integration tests — bulk approve with notifications
        if: env.SUPABASE_URL != ''
        run: |
          deno test --allow-env --allow-net --no-check \
            rpc_bulk_approve_with_notifications_integration_test.ts

      - name: Integration tests — retry FPR notifications
        if: env.SUPABASE_URL != ''
        run: |
          deno test --allow-env --allow-net --no-check \
            rpc_retry_fpr_notifications_integration_test.ts

      - name: Integration tests — dispatch worker
        if: env.SUPABASE_URL != ''
        run: |
          deno test --allow-env --allow-net --no-check \
            line_oa_dispatch_worker_integration_test.ts

      - name: Integration tests — cancel request
        if: env.SUPABASE_URL != ''
        run: |
          deno test --allow-env --allow-net --no-check \
            rpc_cancel_field_purchase_request_integration_test.ts

      - name: Integration tests — bulk cancel
        if: env.SUPABASE_URL != ''
        run: |
          deno test --allow-env --allow-net --no-check \
            rpc_bulk_cancel_field_purchase_request_integration_test.ts

      - name: Integration tests — uncancel request
        if: env.SUPABASE_URL != ''
        run: |
          deno test --allow-env --allow-net --no-check \
            rpc_uncancel_field_purchase_request_integration_test.ts

      - name: Integration tests — bulk uncancel
        if: env.SUPABASE_URL != ''
        run: |
          deno test --allow-env --allow-net --no-check \
            rpc_bulk_uncancel_field_purchase_request_integration_test.ts

      - name: Integration tests — dispatch drain retry
        if: env.SUPABASE_URL != ''
        run: |
          deno test --allow-env --allow-net --no-check \
            line_oa_dispatch_worker_drain_retry_integration_test.ts

      - name: Integration tests — bulk force close
        if: env.SUPABASE_URL != ''
        run: |
          deno test --allow-env --allow-net --no-check \
            rpc_bulk_force_close_field_purchase_request_integration_test.ts

      - name: Integration tests — dead letter alert
        if: env.SUPABASE_URL != ''
        run: |
          deno test --allow-env --allow-net --no-check \
            fpr_dead_letter_alert_integration_test.ts

      - name: Integration tests — e2e smoke (remote, secrets-gated)
        if: env.SUPABASE_URL != ''
        run: |
          deno test --allow-env --allow-net --no-check \
            supabase/tests/e2e_smoke_test.ts

  # ───────────────────────────────────────────────────────────────────────────
  # Job 2: Reconcile production schema (push to main or explicit manual deploy)
  #
  # Production writes are intentionally owned by production-migration-apply.yml,
  # which requires an exact commit, reviewed pending count, encrypted backup,
  # and an explicit APPLY confirmation. This job is read-only: it makes Edge
  # deployment eligible only when hosted migration history already matches the
  # canonical bundle, and reports a clear non-failing deferral while a guarded
  # migration apply is still required.
  # ───────────────────────────────────────────────────────────────────────────
  migrate:
    name: Production Schema Reconciliation (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    if: >-
      github.ref == 'refs/heads/main' &&
      (
        github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && inputs.run_production_deploy == true)
      )

    outputs:
      deployment_ready: ${{ steps.migration_preflight.outputs.ready }}

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_PROJECT_REF: ${{ secrets.MONOLITH_SUPABASE_PROJECT_REF }}

    steps:
      - name: Check database deployment credentials
        id: deployment_preflight
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_PROJECT_REF: ${{ secrets.MONOLITH_SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Database deployment skipped::DATABASE_URL is not configured; tests continue without reporting a false deployment failure."
          elif [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Database deployment skipped::SUPABASE_PROJECT_REF is not configured, so the deployment target cannot be verified."
          elif [[ "$DATABASE_URL" != postgres://* && "$DATABASE_URL" != postgresql://* ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::error title=Invalid database deployment credential::DATABASE_URL must be a full PostgreSQL connection URI."
            exit 1
          elif [[ "$DATABASE_URL" != *"$SUPABASE_PROJECT_REF"* ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::error title=Database target mismatch::DATABASE_URL does not target the project configured by SUPABASE_PROJECT_REF."
            exit 1
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.deployment_preflight.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        if: steps.deployment_preflight.outputs.ready == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Check hosted schema prerequisites
        id: schema_preflight
        if: steps.deployment_preflight.outputs.ready == 'true'
        run: |
          SCHEMA_READY=$(psql "$DATABASE_URL" \
            --no-psqlrc \
            --tuples-only \
            --no-align \
            -v ON_ERROR_STOP=1 \
            -c "SELECT
                  to_regclass('public.organizations') IS NOT NULL
                  AND to_regclass('public.super_admins') IS NOT NULL
                  AND to_regclass('public.notification_digest_queue') IS NOT NULL
                  AND to_regclass('public.platform_metrics_snapshots') IS NOT NULL
                  AND to_regprocedure('public.is_platform_super_admin()') IS NOT NULL;")

          if [ "$SCHEMA_READY" != 't' ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Database deployment skipped::The configured project is reachable but its core/security schema is not bootstrapped. Run the reviewed bootstrap process before incremental production migrations."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Render canonical migration bundle
        if: steps.schema_preflight.outputs.ready == 'true'
        run: bash scripts/create_production_bootstrap_plan.sh deployment-plan

      - name: Capture hosted migration inventory (read-only)
        if: steps.schema_preflight.outputs.ready == 'true'
        env:
          PGOPTIONS: '-c default_transaction_read_only=on'
        run: |
          bash scripts/capture_hosted_bootstrap_inventory.sh \
            hosted-deployment-inventory.json

      - name: Reconcile hosted history before Edge deployment
        id: migration_preflight
        if: steps.schema_preflight.outputs.ready == 'true'
        run: |
          node scripts/compare_hosted_migration_inventory.mjs \
            hosted-deployment-inventory.json \
            deployment-plan/migration-manifest.tsv \
            deployment-plan/duplicate-version-map.tsv \
            hosted-deployment-reconciliation.json \
            hosted-deployment-reconciliation.md

          if jq -e '
            .historyOrderingCandidate == true
            and .canonicalVersionsMissing == 0
            and .historicalGapCount == 0
            and (.hostedVersionsNotCanonical | length) == 0
            and (.duplicateHostedVersions | length) == 0
            and .productionWritesPerformed == false
          ' hosted-deployment-reconciliation.json > /dev/null; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Hosted migration history matches the canonical bundle."
          elif jq -e '
            .historyOrderingCandidate == true
            and .canonicalVersionsMissing > 0
            and .historicalGapCount == 0
            and (.hostedVersionsNotCanonical | length) == 0
            and (.duplicateHostedVersions | length) == 0
            and .productionWritesPerformed == false
          ' hosted-deployment-reconciliation.json > /dev/null; then
            PENDING_MIGRATIONS="$(jq -r '.canonicalVersionsMissing' \
              hosted-deployment-reconciliation.json)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Edge deployment deferred::Hosted is ${PENDING_MIGRATIONS} canonical migrations behind. Run the reviewed Production Migration Apply workflow; this read-only gate does not report a failed deployment."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::error title=Hosted migration history is unsafe::History has gaps, unknown versions, duplicates, or incompatible ordering. Review hosted-deployment-reconciliation.json before any production write."
            jq '{
              canonicalVersionsMissing,
              historicalGapCount,
              hostedVersionsNotCanonical,
              duplicateHostedVersions,
              historyOrderingCandidate
            }' hosted-deployment-reconciliation.json
            exit 1
          fi

  # ───────────────────────────────────────────────────────────────────────────
  # Job 3: Deploy Supabase Edge Functions (push or explicit manual deploy)
  # ───────────────────────────────────────────────────────────────────────────
  deploy-functions:
    name: Deploy Edge Functions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: migrate
    if: >-
      github.ref == 'refs/heads/main' &&
      (
        github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && inputs.run_production_deploy == true)
      ) &&
      needs.migrate.outputs.deployment_ready == 'true'

    steps:
      - name: Check Edge Function deployment credentials
        id: deployment_preflight
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.MONOLITH_SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.MONOLITH_SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_PROJECT_REF" ] || [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Edge Function deployment skipped::SUPABASE_PROJECT_REF or SUPABASE_ACCESS_TOKEN is not configured."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.deployment_preflight.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        if: steps.deployment_preflight.outputs.ready == 'true'
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.116.0

      - name: Deploy field-purchase-line (LINE webhook handler)
        if: steps.deployment_preflight.outputs.ready == 'true'
        run: |
          supabase functions deploy field-purchase-line \
            --project-ref ${{ secrets.MONOLITH_SUPABASE_PROJECT_REF }} \
            --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.MONOLITH_SUPABASE_ACCESS_TOKEN }}

      - name: Deploy line-oa-dispatch-worker
        if: steps.deployment_preflight.outputs.ready == 'true'
        run: |
          supabase functions deploy line-oa-dispatch-worker \
            --project-ref ${{ secrets.MONOLITH_SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.MONOLITH_SUPABASE_ACCESS_TOKEN }}

  # ───────────────────────────────────────────────────────────────────────────
  # Hosted security verification (manual, read-only)
  #   Confirms the production schema state required to close security issues
  #   #49 and #50. The database session is forced read-only and neither applies
  #   migrations nor exposes repository secrets in logs.
  # ───────────────────────────────────────────────────────────────────────────
  hosted-security-verify:
    name: Hosted RLS verification (#49/#50)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Check hosted verification credentials
        id: preflight
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_PROJECT_REF: ${{ secrets.MONOLITH_SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Hosted RLS verification skipped::DATABASE_URL or SUPABASE_PROJECT_REF is not configured."
          elif [[ "$DATABASE_URL" != postgres://* && "$DATABASE_URL" != postgresql://* ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::error title=Invalid hosted verification credential::DATABASE_URL must be a full PostgreSQL connection URI."
            exit 1
          elif [[ "$DATABASE_URL" != *"$SUPABASE_PROJECT_REF"* ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::error title=Database target mismatch::DATABASE_URL does not target the project configured by SUPABASE_PROJECT_REF."
            exit 1
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install PostgreSQL client
        if: steps.preflight.outputs.ready == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Query hosted RLS state through a read-only database session
        if: steps.preflight.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PGOPTIONS: "-c default_transaction_read_only=on"
        run: |
          read -r -d '' QUERY <<'SQL' || true
          WITH targets(issue_number, table_name) AS (
            VALUES
              (49, 'notification_digest_queue'::text),
              (50, 'platform_metrics_snapshots'::text)
          ), table_state AS (
            SELECT
              t.issue_number,
              t.table_name,
              (c.oid IS NOT NULL) AS table_exists,
              (to_regclass('public.organizations') IS NOT NULL) AS organizations_exists,
              (to_regclass('public.super_admins') IS NOT NULL) AS super_admins_exists,
              (to_regprocedure('public.is_platform_super_admin()') IS NOT NULL) AS super_admin_function_exists,
              COALESCE(c.relrowsecurity, false) AS rls_enabled
            FROM targets t
            LEFT JOIN pg_catalog.pg_namespace n
              ON n.nspname = 'public'
            LEFT JOIN pg_catalog.pg_class c
              ON c.relnamespace = n.oid
             AND c.relname = t.table_name
             AND c.relkind IN ('r', 'p')
          ), policy_state AS (
            SELECT
              s.*,
              CASE s.table_name
                WHEN 'notification_digest_queue' THEN EXISTS (
                  SELECT 1
                  FROM pg_catalog.pg_policies p
                  WHERE p.schemaname = 'public'
                    AND p.tablename = s.table_name
                    AND p.policyname = 'digest_queue_own_user_select'
                    AND p.cmd = 'SELECT'
                    AND p.qual ILIKE '%user_id%'
                    AND p.qual ILIKE '%uid()%'
                )
                WHEN 'platform_metrics_snapshots' THEN
                  EXISTS (
                    SELECT 1
                    FROM pg_catalog.pg_policies p
                    WHERE p.schemaname = 'public'
                      AND p.tablename = s.table_name
                      AND p.policyname = 'platform_metrics_super_admin_select'
                      AND p.cmd = 'SELECT'
                      AND p.qual ILIKE '%is_platform_super_admin%'
                  )
                  AND EXISTS (
                    SELECT 1
                    FROM pg_catalog.pg_policies p
                    WHERE p.schemaname = 'public'
                      AND p.tablename = s.table_name
                      AND p.policyname = 'platform_metrics_super_admin_insert'
                      AND p.cmd = 'INSERT'
                      AND p.with_check ILIKE '%is_platform_super_admin%'
                  )
                ELSE false
              END AS required_policies_present,
              NOT EXISTS (
                SELECT 1
                FROM pg_catalog.pg_policies p
                WHERE p.schemaname = 'public'
                  AND p.tablename = s.table_name
                  AND p.cmd = 'SELECT'
                  AND p.permissive = 'PERMISSIVE'
                  AND lower(trim(p.qual)) IN ('true', '(true)', '1 = 1', '(1 = 1)')
              ) AS no_permissive_select_bypass
            FROM table_state s
          )
          SELECT
            issue_number,
            table_name,
            table_exists,
            organizations_exists,
            super_admins_exists,
            super_admin_function_exists,
            rls_enabled,
            required_policies_present,
            no_permissive_select_bypass,
            (
              table_exists
              AND organizations_exists
              AND super_admins_exists
              AND super_admin_function_exists
              AND rls_enabled
              AND required_policies_present
              AND no_permissive_select_bypass
            ) AS verified
          FROM policy_state
          ORDER BY issue_number
          SQL

          psql "$DATABASE_URL" \
            --no-psqlrc \
            --tuples-only \
            --no-align \
            -v ON_ERROR_STOP=1 \
            -c "SELECT COALESCE(json_agg(result), '[]'::json) FROM ($QUERY) AS result;" \
            > hosted-security-verification.json

          jq -e 'type == "array"' hosted-security-verification.json >/dev/null

          jq -r '.[] | "issue #\(.issue_number) \(.table_name): exists=\(.table_exists), organizations=\(.organizations_exists), super_admins=\(.super_admins_exists), super_admin_function=\(.super_admin_function_exists), rls=\(.rls_enabled), policies=\(.required_policies_present), no_bypass=\(.no_permissive_select_bypass), verified=\(.verified)"' \
            hosted-security-verification.json

          jq -e 'length == 2 and all(.[]; .verified == true)' \
            hosted-security-verification.json >/dev/null || {
              echo "::error title=Hosted RLS verification failed::One or more source dependencies, target tables, or production policy contracts are missing."
              exit 1
            }

      - name: Upload hosted security evidence
        if: always() && steps.preflight.outputs.ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hosted-security-verification-${{ github.sha }}
          path: hosted-security-verification.json
          if-no-files-found: warn
          retention-days: 90

  # ───────────────────────────────────────────────────────────────────────────
  # Job 4: E2E Smoke Tests — local Supabase via `supabase start`
  #   Spins up a full local Postgres+Auth stack, auto-applies all migrations
  #   in supabase/migrations/ (CI prereq stubs + 0176→0215), then runs the
  #   Deno e2e_smoke_test.ts against it.
  #   Runs on every PR and workflow_dispatch so regressions are caught before merge.
  # ───────────────────────────────────────────────────────────────────────────
  e2e-smoke:
    name: E2E Smoke Tests (local Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Runs in parallel with Job 1 — does not need remote secrets
    needs: []

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Deno runtime ───────────────────────────────────────────────────────
      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      # ── Supabase CLI ───────────────────────────────────────────────────────
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.116.0

      # ── Write e2e prereq migration stubs ──────────────────────────────────
      # These files are written to the runner's checkout only — NOT committed.
      #
      # File 1 (0000): creates organizations + org_members with exact column
      # names expected by 0173_rls_isolation_hardening.sql's safety pre-check.
      #
      # File 2 (0172_z): runs just before 0173; creates all remaining platform
      # tables (org_invitations, notification_digest_queue,
      # platform_metrics_snapshots, super_admins); pre-adds org_id columns and
      # creates indexes NON-concurrently on app tables so that 0173's
      # CREATE INDEX CONCURRENTLY IF NOT EXISTS statements are silent no-ops
      # (CONCURRENTLY cannot run inside a transaction block, but IF NOT EXISTS
      # on a pre-existing index is always a no-op regardless).
      - name: Write e2e prereq migration stubs
        run: |
          # ── File 1: satisfies 0173 existence pre-checks ─────────────────────
          cat > supabase/migrations/0000_e2e_prereqs.sql << 'SQL'
          -- E2E CI prereq stub: satisfies organizations/org_members existence
          -- guards inside 0173_rls_isolation_hardening.sql.
          -- Generated at CI runtime. NOT committed to the repo.

          -- iter 25l: added slug/plan/status/max_users/max_jobs_per_month/settings
          -- so that 0182 sentinel INSERT (slug) and later org migrations compile cleanly
          CREATE TABLE IF NOT EXISTS organizations (
            org_id              uuid        PRIMARY KEY DEFAULT gen_random_uuid(),
            name                text        NOT NULL    DEFAULT 'E2E Test Org',
