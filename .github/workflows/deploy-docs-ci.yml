name: Validate Manufacturing OS Docs (CI)

on:
  push:
    branches:
      - main
    paths:
      - 'docs/manufacturing-os-site/**'
  pull_request:
    branches:
      - main
    paths:
      - 'docs/manufacturing-os-site/**'
  workflow_dispatch:

jobs:
  validate:
    name: Validate Site Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          echo "========================================"
          echo "  Monolith Manufacturing OS — CI Check  "
          echo "========================================"
          SITE_DIR="docs/manufacturing-os-site"
          REQUIRED_FILES=("index.html" "script.js" "style.css" "chapters.json" "search_index.json" "analytics.html" "changelog.html" "README.md")
          FAIL=0
          for f in "${REQUIRED_FILES[@]}"; do
            if [ -f "$SITE_DIR/$f" ]; then
              SIZE=$(wc -c < "$SITE_DIR/$f")
              echo "  ✅ $f — ${SIZE} bytes"
            else
              echo "  ❌ MISSING: $f"
              FAIL=1
            fi
          done
          if [ $FAIL -ne 0 ]; then
            echo ""
            echo "FAIL: One or more required files are missing."
            exit 1
          fi

      - name: Validate JSON files
        run: |
          echo ""
          echo "=== JSON Validation ==="
          SITE_DIR="docs/manufacturing-os-site"

          # Validate chapters.json
          CHAPTER_COUNT=$(python3 -c "
          import json, sys
          try:
              data = json.load(open('$SITE_DIR/chapters.json'))
              print(len(data))
          except Exception as e:
              print(f'ERROR: {e}', file=sys.stderr)
              sys.exit(1)
          ")
          echo "  ✅ chapters.json — ${CHAPTER_COUNT} chapters"
          if [ "$CHAPTER_COUNT" -ne 55 ]; then
            echo "  ⚠️  WARNING: Expected 55 chapters, found ${CHAPTER_COUNT}"
          fi

          # Validate search_index.json
          INDEX_COUNT=$(python3 -c "
          import json, sys
          try:
              data = json.load(open('$SITE_DIR/search_index.json'))
              print(len(data))
          except Exception as e:
              print(f'ERROR: {e}', file=sys.stderr)
              sys.exit(1)
          ")
          echo "  ✅ search_index.json — ${INDEX_COUNT} chapters indexed"

      - name: Print site summary
        run: |
          echo ""
          echo "=== Monolith Manufacturing OS — Site Summary ==="
          echo "  Chapters     : 55 (Foundation + 15 Phases)"
          echo "  MCP Tools    : 123 total (21 Foundation + 9×5 + 6×9 + 3×1)"
          echo "  Features     : Full-text search, Dark/Light mode,"
          echo "                 Syntax highlighting, PDF export,"
          echo "                 Analytics dashboard, Changelog"
          echo ""
          echo "  Live URL     : https://indetailsgroup-hue.github.io/monolith-workspace/"
          echo "  Repo path    : docs/manufacturing-os-site/"
          echo ""
          echo "  CI Status    : ✅ All checks passed"
