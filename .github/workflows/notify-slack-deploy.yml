# ──────────────────────────────────────────────────────────────────────────────
# notify-slack-deploy.yml
# Sends a Slack notification whenever deploy-docs-pages.yml completes.
#
# Required secret:
#   SLACK_WEBHOOK_URL — Slack Incoming Webhook URL
#   (Settings → Secrets and variables → Actions → New repository secret)
# ──────────────────────────────────────────────────────────────────────────────
name: Notify Slack on Deploy

on:
  workflow_run:
    workflows:
      - "Deploy Manufacturing OS Docs to GitHub Pages"   # must match `name:` in deploy-docs-pages.yml
    types:
      - completed

jobs:
  slack-notify:
    name: Send Slack Notification
    runs-on: ubuntu-latest
    # Run for both success and failure
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure' }}

    steps:
      - name: Prepare payload
        id: payload
        run: |
          CONCLUSION="${{ github.event.workflow_run.conclusion }}"
          RUN_ID="${{ github.event.workflow_run.id }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${RUN_ID}"
          COMMIT_SHA="${{ github.event.workflow_run.head_sha }}"
          COMMIT_SHORT="${COMMIT_SHA:0:7}"
          COMMIT_URL="https://github.com/${{ github.repository }}/commit/${COMMIT_SHA}"
          SITE_URL="https://indetailsgroup-hue.github.io/monolith-workspace/"
          BRANCH="${{ github.event.workflow_run.head_branch }}"
          ACTOR="${{ github.event.workflow_run.actor.login }}"
          TRIGGERED_AT="${{ github.event.workflow_run.run_started_at }}"

          if [ "$CONCLUSION" = "success" ]; then
            EMOJI=":white_check_mark:"
            STATUS_TEXT="Deploy *succeeded*"
            COLOR="good"
          else
            EMOJI=":x:"
            STATUS_TEXT="Deploy *failed*"
            COLOR="danger"
          fi

          # Write JSON payload to file (avoids shell escaping issues)
          cat > /tmp/slack_payload.json << JSON
          {
            "attachments": [
              {
                "color": "${COLOR}",
                "fallback": "${STATUS_TEXT} — Monolith Manufacturing OS Docs (${BRANCH})",
                "blocks": [
                  {
                    "type": "header",
                    "text": {
                      "type": "plain_text",
                      "text": "${EMOJI} Monolith Manufacturing OS — Docs Deploy"
                    }
                  },
                  {
                    "type": "section",
                    "fields": [
                      {
                        "type": "mrkdwn",
                        "text": "*Status:*\n${STATUS_TEXT}"
                      },
                      {
                        "type": "mrkdwn",
                        "text": "*Branch:*\n\`${BRANCH}\`"
                      },
                      {
                        "type": "mrkdwn",
                        "text": "*Commit:*\n<${COMMIT_URL}|\`${COMMIT_SHORT}\`>"
                      },
                      {
                        "type": "mrkdwn",
                        "text": "*Triggered by:*\n${ACTOR}"
                      }
                    ]
                  },
                  {
                    "type": "actions",
                    "elements": [
                      {
                        "type": "button",
                        "text": { "type": "plain_text", "text": "View Run" },
                        "url": "${RUN_URL}"
                      },
                      {
                        "type": "button",
                        "text": { "type": "plain_text", "text": "Open Site" },
                        "url": "${SITE_URL}"
                      }
                    ]
                  }
                ]
              }
            ]
          }
          JSON

          echo "payload_file=/tmp/slack_payload.json" >> $GITHUB_OUTPUT

      - name: Send to Slack
        run: |
          HTTP_STATUS=$(curl -s -o /tmp/slack_response.txt -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            --data @${{ steps.payload.outputs.payload_file }} \
            "${{ secrets.SLACK_WEBHOOK_URL }}")

          echo "Slack response HTTP ${HTTP_STATUS}: $(cat /tmp/slack_response.txt)"

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::Slack notification failed with HTTP ${HTTP_STATUS}"
            exit 1
          fi
