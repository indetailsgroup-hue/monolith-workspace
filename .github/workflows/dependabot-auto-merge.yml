name: Dependabot Auto-Merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  pull-requests: write
  contents: write


concurrency:
  group: dependabot-auto-merge-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  auto-merge:
    name: Auto-merge patch Storybook / Vitest PRs
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'

    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto-merge patch updates (storybook or vitest groups)
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-patch' &&
          (steps.metadata.outputs.dependency-group == 'storybook' ||
           steps.metadata.outputs.dependency-group == 'vitest')
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
