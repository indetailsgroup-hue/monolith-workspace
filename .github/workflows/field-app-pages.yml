# The ONLY workflow that deploys GitHub Pages. One artifact holds all three sites:
#   /           Field PWA            (ADR-040 มติ 5)
#   /designer/  Designer Workspace   (ADR-057)
#   /docs/      Manufacturing OS docs (docs/manufacturing-os-site)
#   /404.html   .github/pages/404.html: Pages has no SPA fallback, so this page
#               sends Designer deep links and refreshes back into the app;
#               every other missing path stays a 404
# A Pages deploy replaces the whole site, so a second deploying workflow would
# wipe the other two. From 2026-09-21 the docs-only deploys did exactly that,
# which left /designer/ and the Field PWA returning 404.
# static ล้วน ไม่มีข้อมูลบริษัท at rest
name: Deploy GitHub Pages
on:
  push:
    branches: [main]
    paths: ['packages/field-app/**', 'src/**', 'public/**', 'index.html', 'vite.config.*', 'docs/manufacturing-os-site/**', '.github/workflows/field-app-pages.yml', '.github/pages/**']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    # Where the project site is served. The Designer's Vite base and the links in
    # 404.html both come from it, so a custom domain changes this one value ('/').
    env: { SITE_BASE: /monolith-workspace/ }
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - run: npm ci
      # Gate the deploy on the field-app test suite (FS-B1-04).
      - run: npm run test:run -w @daph/field-app
      - run: npm run build -w @daph/field-app
        env:
          VITE_SUPABASE_URL: ${{ secrets.FIELD_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.FIELD_SUPABASE_ANON_KEY }}
          VITE_LINE_LOGIN_CHANNEL_ID: ${{ vars.VITE_LINE_LOGIN_CHANNEL_ID }}
          VITE_MONOLITH_URL: ${{ vars.VITE_MONOLITH_URL }}
      # MONOLITH (ADR-057): เสิร์ฟใต้ /designer/ ใน Pages เดียวกัน — deep link จาก DesignerHome
      - run: npm run build -- --base="${SITE_BASE}designer/"
        env:
          VITE_SUPABASE_URL: ${{ secrets.FIELD_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.FIELD_SUPABASE_ANON_KEY }}
          VITE_FACTORY_API_BASE: https://kqzjqqvbrukxpjseqvua.supabase.co/functions/v1/factory-api
      - run: mkdir -p packages/field-app/dist/designer && cp -r dist/* packages/field-app/dist/designer/
      # Docs site under /docs/. Checks moved here from the retired docs-only deploy workflows.
      - name: Verify docs site files
        run: |
          SITE_DIR=docs/manufacturing-os-site
          for f in index.html script.js style.css chapters.json search_index.json; do
            [ -f "$SITE_DIR/$f" ] || { echo "::error file=$SITE_DIR/$f::missing"; exit 1; }
          done
          python3 -c "import json,sys; d=json.load(open('$SITE_DIR/chapters.json')); sys.exit(0 if len(d) else 'chapters.json is empty')"
          python3 -c "import json; json.load(open('$SITE_DIR/search_index.json'))"
      - run: mkdir -p packages/field-app/dist/docs && cp -r docs/manufacturing-os-site/. packages/field-app/dist/docs/
      # Pages uses only the site-root 404.html; the Designer's deep links depend on it.
      - run: sed "s#__SITE_BASE__#${SITE_BASE}#g" .github/pages/404.html > packages/field-app/dist/404.html
      - name: Verify all three sites are in the artifact
        run: |
          for f in index.html 404.html designer/index.html docs/index.html docs/chapters.json; do
            [ -f "packages/field-app/dist/$f" ] || { echo "::error::artifact is missing $f"; exit 1; }
          done
          if grep -q __SITE_BASE__ packages/field-app/dist/404.html; then echo "::error::404.html still has the __SITE_BASE__ placeholder"; exit 1; fi
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with: { path: packages/field-app/dist }
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
