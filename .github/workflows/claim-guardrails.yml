# MONOLITH claim-guardrails — CI gate (Task 7, Decision 3).
#
# Of the three enforcement layers this is the ONLY one with actual authority:
# the PostToolUse hook can be disabled in settings and the pre-commit hook can be
# skipped with --no-verify, but a push or PR cannot dodge this job.
#
# =====================================================================
#  STATUS: VERIFIED IN BOTH DIRECTIONS, 31 July 2026.
#
#  This block used to say UNVERIFIED, and required someone to push a
#  deliberate violation and watch the job go red before anyone could call the
#  gate working. That happened — without needing a synthetic violation,
#  because the first push met real content:
#
#    red    969032e4  run 30614279747 (push) and 30614304416 (pull_request)
#           108 unevidenced absence claims across 37 files, plus 4
#           uncorroborated certifications across 4 files. Every one was
#           pre-existing content in docs/; the branch that triggered it wrote
#           none of them. This was the linters' first contact with the full
#           docs/ tree, which is hundreds of files where the branch they were
#           developed on held 25.
#
#    green  6d66baca  run 30614523133 (push) and 30614526422 (pull_request)
#           after the pre-existing findings were adopted into the shrink-only
#           ledger at tools/.lint_allowlist: lint_claims 110 hits/25 files ->
#           218/62, lint_certifications 5/3 -> 9/7.
#
#  So the gate has been seen to fail on real findings and to pass once they
#  were accounted for. It is a working gate, not a written one.
#
#  What that does NOT establish: the deny direction was exercised by content
#  that already existed, not by a violation authored to test it, so the
#  detector's behaviour on a NEW claim shape is still only covered by the unit
#  suite in tests/agent_guardrails/. And the adoption did not fix the 108
#  findings — they are real, they are on a ledger that can only shrink, and
#  the debt line is printed on every run.
# =====================================================================
#
# The linters run against the committed ledger `tools/.lint_allowlist`. There is
# deliberately NO --allowlist override anywhere below: a doctored ledger path was
# identified as a bypass, so the committed default is the sole authority. Python
# standard library only — no pip installs, by design.

name: claim-guardrails

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly deep sweep (UTC). The deep job below gates itself on this event.
    - cron: "17 2 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    # Local mode: every negative claim carries evidence, every certification is
    # corroborated, within the committed allowlist. Runs on every push and PR.
    name: claim + certification linters (local mode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: negative-claim linter
        run: python tools/lint_claims.py docs/
      - name: certification linter
        run: python tools/lint_certifications.py docs/

  deep:
    # Deep re-verification is expensive (a full-tree walk per absence term), so
    # it runs on the nightly schedule and on demand only — never on every push.
    name: deep absence re-verification (schedule + on demand)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the deep sweep's git-grep / git-log searches are
          # complete rather than shallow.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: deep re-verification of every recorded absence
        run: python tools/lint_claims.py docs/ --deep
