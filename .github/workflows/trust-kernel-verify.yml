# =============================================================================
# trust-kernel-verify.yml — Shadow Trust-Ready complete-output CI gate (plan Task 12
# Step 4; design §16, §17.1).
#
#  ##  UNVERIFIED  ##
#  THIS WORKFLOW HAS NEVER RUN. The trust-kernel worktree is NOT pushed to any
#  remote, so GitHub Actions has never executed a single line of this file. It is
#  authored from the local command contracts (plan Step 6) but is UNPROVEN on CI
#  infrastructure. Do NOT claim it "works" or "passes".
#
#  FIRST PUSHER MUST, before trusting this gate:
#    1. Push the branch and open the Actions run; confirm every job is discovered
#       and the toolchain (Node 22, Supabase CLI, Playwright, Python) resolves.
#    2. Push a DELIBERATE violation of each guarantee and watch the final gate FAIL:
#         - add a `it.skip(...)` to a trust-kernel test        -> gate rejects a SKIP
#         - make one trust-kernel test fail                    -> gate rejects a FAILURE
#         - delete a required report before the final job      -> gate rejects MISSING REPORT
#         - perturb the deterministic packet on one OS         -> gate rejects HASH MISMATCH
#       Only after each intentional break is caught should this gate be trusted.
#    3. There is NO `--allowlist`/override escape hatch anywhere here by design; do
#       not add one.
# =============================================================================
name: Trust Kernel Verify (Shadow Trust-Ready)

on:
  push:
    branches: [main, "trust-kernel/**", "codex/**", "repair-intelligence/**"]
    paths:
      # Whole server tree, not just server/src/trust-kernel — the Phase 0
      # containment guards live in server/src/api/routes and server/src/index.ts
      # (review #4: a change to artifacts.ts/exports.ts alone must trigger CI).
      - "server/src/**"
      - "tools/factory-packet-verifier/**"
      - "src/factory/**"
      - "src/core/**"
      - "supabase/**"
      - "e2e/trust-kernel/**"
      - "docs/governance/**"
      - "scripts/trust-kernel/**"
      - ".github/workflows/trust-kernel-verify.yml"
  pull_request:
    paths:
      - "server/src/**"
      - "tools/factory-packet-verifier/**"
      - "supabase/**"
      - "e2e/trust-kernel/**"
      - "docs/governance/**"
      - "scripts/trust-kernel/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # (1) Cross-platform deterministic + server + verifier tests. Windows AND Ubuntu
  # both run; the golden packet sha from each OS is captured for the byte-identity
  # check in the final gate. Every noisy command writes a machine-readable report.
  # ---------------------------------------------------------------------------
  matrix-tests:
    name: tests-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Split for the same reason as C4: a failure of `npm ci` (root) must not be
      # swallowed by a following command on windows-latest's pwsh shell.
      - name: Install root workspaces
        run: npm ci
      - name: Install server workspace
        run: npm ci --prefix server

      - name: Server trust-kernel + full suite (JSON report)
        run: npm --prefix server test -- --run --reporter=json --outputFile=../reports/server-${{ matrix.os }}.json
        env:
          CI: "true"

      - name: Deterministic packet suite (JSON report)
        run: npm --prefix server test -- --run src/trust-kernel/test/packetV3.determinism.test.ts --reporter=json --outputFile=../reports/determinism-${{ matrix.os }}.json

      - name: Build independent verifier
        run: npm run build -w tools/factory-packet-verifier

      - name: Verifier + hostile-corpus suite (JSON report)
        run: npm test -w tools/factory-packet-verifier -- --run --reporter=json --outputFile=reports/verifier-${{ matrix.os }}.json

      - name: Frontend containment suite (Task 11 + Task 12 export, JSON report)
        run: npx vitest run src/factory/packet/__tests__/trustKernelContainment.test.ts src/core/api/__tests__/exportApi.containment.test.ts --reporter=json --outputFile=reports/containment-${{ matrix.os }}.json

      - name: Repair Phase 0 policy + legacy-route containment (JSON report)
        run: npm --prefix server test -- --run src/trust-kernel/test/repairPhase0Policy.test.ts src/trust-kernel/test/repairLegacyRouteContainment.test.ts --reporter=json --outputFile=../reports/repair-${{ matrix.os }}.json

      # C4: SEPARATE steps. A non-last command in a single pwsh multi-line `run:`
      # block on windows-latest has its failure SWALLOWED (GitHub appends the
      # $LASTEXITCODE check only after the LAST line). Splitting makes each command
      # its own step so a typecheck failure fails the job on every OS.
      - name: Root typecheck
        run: npm run typecheck:all
      - name: Root build
        run: npm run build

      - name: Route disposition ledger (single authority, no P2/actor breach, no deferrals)
        shell: bash
        run: |
          set -o pipefail
          mkdir -p reports
          node scripts/trust-kernel/verify-route-ledger.mjs | tee reports/route-ledger.txt

      - name: Repair Phase 0 disposition ledger (report is gate evidence)
        shell: bash
        run: |
          set -o pipefail
          mkdir -p reports
          node scripts/trust-kernel/verify-repair-phase0-ledger.mjs --report reports/phase0/repair-phase0-ledger.json
          cp reports/phase0/repair-phase0-ledger.json reports/repair-phase0-ledger.json

      - name: Repair Phase 0 bilingual document verifier
        shell: bash
        run: |
          set -o pipefail
          mkdir -p reports
          node scripts/trust-kernel/verify-repair-phase0-docs.mjs | tee reports/repair-docs.txt

      - name: Final-gate self-test (the gate itself is proven before it judges)
        run: node scripts/trust-kernel/final-gate-check.selftest.mjs

      - name: Capture golden packet sha (byte-identity input)
        shell: bash
        run: |
          mkdir -p reports
          node -e "const c=require('crypto'),fs=require('fs');const b=fs.readFileSync('test-vectors/factory-packet-v3/valid-minimal/packet.zip');const h=c.createHash('sha256').update(b).digest('hex');fs.writeFileSync('reports/golden-${{ matrix.os }}.sha', h);console.log('golden', '${{ matrix.os }}', h);"
          # The committed expected sha must match the recomputed one on THIS OS.
          EXPECT=$(cat test-vectors/factory-packet-v3/valid-minimal/expected-packet.sha256 | tr -d '[:space:]')
          GOT=$(cat reports/golden-${{ matrix.os }}.sha)
          if [ "$EXPECT" != "$GOT" ]; then echo "::error::golden packet sha drift on ${{ matrix.os }}: expected $EXPECT got $GOT"; exit 1; fi

      - name: Upload reports (${{ matrix.os }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.os }}
          path: reports/
          retention-days: 90

  # ---------------------------------------------------------------------------
  # (2) Edge transport tests + local Supabase pgTAP (5 trust-kernel suites + the
  # workflow invariants). TAP output per suite; a failure or an empty suite fails.
  # ---------------------------------------------------------------------------
  edge-db:
    name: edge + pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Install root workspaces
        run: npm ci

      - name: Start local Supabase (applies migration chain incl. 0180-0184)
        run: supabase start

      - name: Edge factory-api + capture-ocr default-block tests (JSON report)
        run: npx vitest run supabase/functions/factory-api/index.test.ts supabase/functions/capture-ocr-extract/index.test.ts --reporter=json --outputFile=reports/edge.json

      - name: pgTAP trust-kernel + Repair Phase 0 suites (per-suite TAP)
        shell: bash
        run: |
          set -o pipefail
          mkdir -p reports
          DB="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          for suite in trust_kernel_tenancy trust_kernel_governance trust_kernel_release trust_kernel_bundles trust_kernel_containment workflow_db_invariants trust_kernel_safety repair_phase0_organization repair_phase0_containment; do
            psql "$DB" -tA -v ON_ERROR_STOP=1 -f "supabase/tests/${suite}.sql" | tee "reports/pgtap-${suite}.tap"
            if grep -qE '^not ok' "reports/pgtap-${suite}.tap"; then echo "::error::pgTAP failure in ${suite}"; exit 1; fi
            if ! grep -qE '^ok ' "reports/pgtap-${suite}.tap"; then echo "::error::empty pgTAP suite ${suite}"; exit 1; fi
          done

      - name: Upload edge + pgTAP reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-edge-db
          path: reports/
          retention-days: 90

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup || true

  # ---------------------------------------------------------------------------
  # (3) Playwright shadow E2E — two-person release + revocation-race chaos. The app
  # + Supabase stack and two authenticated user JWTs are provided by CI secrets.
  # ---------------------------------------------------------------------------
  e2e:
    name: shadow E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install root workspaces
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run trust-kernel shadow E2E (JSON report)
        run: npx playwright test e2e/trust-kernel --reporter=json > reports/e2e.json
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
          E2E_DESIGNER_A_JWT: ${{ secrets.E2E_DESIGNER_A_JWT }}
          E2E_APPROVER_B_JWT: ${{ secrets.E2E_APPROVER_B_JWT }}
          E2E_TENANT_002_JWT: ${{ secrets.E2E_TENANT_002_JWT }}
      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-e2e
          path: reports/
          retention-days: 90

  # ---------------------------------------------------------------------------
  # (4) Claim / certification linters (guardrails), PINNED to the governance
  # baseline commit 55557d7f178dcbe00fec15cffb3061df668eaff8 (Repair Phase 0
  # Task 8 Step 4). Missing tools FAIL the job — this is load-bearing evidence,
  # never a warning, and the final gate demands the CLAIM LINTERS: PASS report.
  # ---------------------------------------------------------------------------
  claim-linters:
    name: claim linters (pinned governance baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 55557d7f178dcbe00fec15cffb3061df668eaff8
          path: .governance-tools
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run pinned claim and certification linters
        shell: bash
        run: |
          set -o pipefail
          mkdir -p reports
          # Copy the PINNED linters beside the product tree so the shared
          # shrinking allowlist (tools/.lint_allowlist, keys relative to this
          # repo root) resolves identically here and in local runs. The tools
          # come only from the pinned governance checkout — a missing tool
          # fails this job.
          cp .governance-tools/tools/lint_claims.py \
             .governance-tools/tools/lint_certifications.py \
             .governance-tools/tools/lint_allowlist.py \
             .governance-tools/tools/claim_detect.py \
             .governance-tools/tools/verify_absence.py tools/
          python tools/lint_claims.py docs/governance --allowlist tools/.lint_allowlist
          python tools/lint_certifications.py docs/governance --allowlist tools/.lint_allowlist
          echo "CLAIM LINTERS: PASS" | tee reports/claim-linters.txt
      - name: Upload claim-linter report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-claim-linters
          path: reports/
          retention-days: 90

  # ---------------------------------------------------------------------------
  # (5) Evidence self-verification. Builds the evidence manifest + signs the
  # EvidenceAttestationV1 through the managed EVIDENCE signer and self-verifies. With
  # no signer/verifier configured this FAILS CLOSED — that is the correct behavior; a
  # green here requires a real, separate evidence key + verify endpoint.
  # ---------------------------------------------------------------------------
  evidence-self-verify:
    name: evidence self-verify (fail-closed)
    runs-on: ubuntu-latest
    needs: [matrix-tests, edge-db, e2e, claim-linters]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install server workspace
        run: npm ci --prefix server
      - name: Build server (compiles evidence modules)
        run: npm --prefix server run build
      - name: Download complete upstream report set
        uses: actions/download-artifact@v4
        with:
          path: all-reports
      - name: Validate reports + build run-specific evidence manifest
        env:
          R_MATRIX: ${{ needs.matrix-tests.result }}
          R_EDGE: ${{ needs.edge-db.result }}
          R_E2E: ${{ needs.e2e.result }}
          R_CLAIM: ${{ needs.claim-linters.result }}
          EVIDENCE_SIGNER_KEY_ID: ${{ secrets.EVIDENCE_SIGNER_KEY_ID }}
        run: node scripts/trust-kernel/build-evidence-manifest.mjs all-reports reports/evidence-manifest.json
      # C3: presence-of-env is NOT a passed gate. This step ISSUES + SELF-VERIFIES a
      # real EvidenceAttestation through HTTPS signer/verifier endpoints on distinct
      # origins, with an evidence key id excluded from the declared release-key ids, and
      # writes reports/evidence-attestation.json with `verified: true|false`. The
      # FINAL gate demands verified===true (never the mere success of this job). With
      # no real signer/verify endpoint wired it writes verified:false and fails closed;
      # a Shadow-Trust-Ready pass requires that strict configuration plus a verifier
      # response of verified=true (design §16.4). The report uploads even on failure.
      - name: Issue + self-verify evidence attestation (fail closed; writes proof report)
        id: evidence
        env:
          EVIDENCE_SIGNER_URL: ${{ secrets.EVIDENCE_SIGNER_URL }}
          EVIDENCE_SIGNER_KEY_ID: ${{ secrets.EVIDENCE_SIGNER_KEY_ID }}
          EVIDENCE_VERIFY_URL: ${{ secrets.EVIDENCE_VERIFY_URL }}
          RELEASE_SIGNER_KEY_IDS: ${{ secrets.RELEASE_SIGNER_KEY_IDS }}
        shell: bash
        run: |
          mkdir -p reports
          node scripts/trust-kernel/issue-evidence-attestation.mjs reports/evidence-attestation.json reports/evidence-manifest.json all-reports
      - name: Upload evidence attestation proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-evidence
          path: reports/
          retention-days: 90

  # ---------------------------------------------------------------------------
  # (6) FINAL GATE. Reads the COMPLETE machine-readable reports and rejects any
  # failure, cancellation, skip, missing report, empty suite, or cross-platform hash
  # mismatch. There is no override.
  # ---------------------------------------------------------------------------
  final-gate:
    name: final acceptance gate
    runs-on: ubuntu-latest
    needs: [matrix-tests, edge-db, e2e, claim-linters, evidence-self-verify]
    if: always()
    timeout-minutes: 10
    steps:
      # checkout so the SELF-TESTED gate checker (scripts/trust-kernel/final-gate-check.mjs)
      # is present. The inline heredoc could never be exercised off-CI, which is exactly
      # how the skip/todo/evidence-presence gate bugs (C1-C3) survived. That module is
      # proven by scripts/trust-kernel/final-gate-check.selftest.mjs.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Download all reports
        uses: actions/download-artifact@v4
        with:
          path: all-reports
      - name: Enforce complete-output acceptance
        env:
          R_MATRIX: ${{ needs.matrix-tests.result }}
          R_EDGE: ${{ needs.edge-db.result }}
          R_E2E: ${{ needs.e2e.result }}
          R_CLAIM: ${{ needs.claim-linters.result }}
          R_EVIDENCE: ${{ needs.evidence-self-verify.result }}
          # Both the evidence job result and its manifest-backed attestation proof
          # are load-bearing; neither can substitute for the other.
        shell: bash
        run: node scripts/trust-kernel/final-gate-check.mjs all-reports
