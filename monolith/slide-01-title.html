<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<style>
@page { margin: 0; }
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: Arial, Helvetica, sans-serif; }
.slide-container {
    width: 1280px;
    min-width: 100%;
    height: 720px;
    overflow: hidden;
    background-color: #1f2d5a;
    color: #ffffff;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    border-left: 6px solid #c9a84c;
    border-right: 6px solid #c9a84c;
    position: relative;
}
.title-accent-bar {
    width: 80px;
    height: 4px;
    background-color: #c9a84c;
    margin-bottom: 28px;
}
.top-label {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: rgba(201,168,76,0.85);
    margin-bottom: 20px;
}
h1 {
    font-size: 64px;
    font-weight: 800;
    color: #ffffff;
    text-align: center;
    line-height: 1.1;
    margin-bottom: 12px;
}
h1 span { color: #c9a84c; }
.subtitle {
    font-size: 22px;
    font-weight: 400;
    color: rgba(255,255,255,0.75);
    text-align: center;
    margin-bottom: 36px;
}
.meta-row {
    display: flex;
    gap: 40px;
    justify-content: center;
    align-items: center;
    margin-top: 10px;
}
.meta-chip {
    font-size: 15px;
    font-weight: 600;
    color: #1f2d5a;
    background-color: #c9a84c;
    padding: 8px 22px;
    border-radius: 20px;
}
.meta-text {
    font-size: 15px;
    color: rgba(255,255,255,0.55);
}
.corner-mark {
    position: absolute;
    bottom: 24px;
    right: 40px;
    font-size: 12px;
    color: rgba(255,255,255,0.3);
    letter-spacing: 1px;
}
</style>
</head>
<body>
<div class="slide-container">
    <p class="top-label">Steering Committee Review · กันยายน 2569</p>
    <div class="title-accent-bar"></div>
    <h1>MONOLITH <span>DAPH Decor</span><br>AI Agent Programme</h1>
    <p class="subtitle">SC Review · Phase 1 Complete &amp; Phase 2 Business Case</p>
    <div class="meta-row">
        <p class="meta-chip">Phase 1 Complete</p>
        <p class="meta-text">Coverage 68% Achieved · AMD-004 THB 5.2M Delivered</p>
        <p class="meta-chip">Phase 2 Proposal</p>
    </div>
    <p class="corner-mark">MONOLITH DAPH · SOP v2.5 · 49 Sections</p>
</div>
</body>
</html>
